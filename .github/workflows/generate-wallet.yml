name: Generate Wallet

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      ACCOUNT_ID: ''
    steps:
      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsqlite3-dev pkg-config

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env

      - name: Install Miden CLI
        run: |
          source $HOME/.cargo/env
          cargo install miden-client-cli --locked

      - name: Initialize Miden Testnet Client
        run: |
          source $HOME/.cargo/env
          miden-client init --rpc https://rpc.testnet.miden.io

      - name: Generate Wallet
        id: wallet
        run: |
          source $HOME/.cargo/env
          # Generate new wallet
          OUTPUT=$(miden-client new-wallet)
          echo "$OUTPUT"
          
          # Extract Account ID (assuming standard output format)
          ACCOUNT_ID=$(echo "$OUTPUT" | grep -oE "0x[a-fA-F0-9]+")
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV
          
          # Export wallet
          miden-client export --account-id $ACCOUNT_ID --filename wallet.mac

      - name: Summary
        run: |
          echo "### Miden Wallet Generated 🚀" >> $GITHUB_STEP_SUMMARY
          echo "Your new Wallet Address is: **${{ env.ACCOUNT_ID }}**" >> $GITHUB_STEP_SUMMARY
          echo "Please download the \`wallet.mac\` artifact and fund this address to proceed with the deployment." >> $GITHUB_STEP_SUMMARY

      - name: Upload Wallet Artifact
        uses: actions/upload-artifact@v4
        with:
          name: miden-wallet-backup
          path: wallet.mac
          retention-days: 1

[package]
name = "activity-generator"
version = "0.1.0"
edition = "2024"

[dependencies]
miden-client = { path = "../../miden-client/crates/rust-client", features = ["tonic"] }
miden-client-sqlite-store = { path = "../../miden-client/crates/sqlite-store" }
miden-protocol = { path = "../miden-protocol" }
miden-standards = { path = "../miden-standards" }
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
